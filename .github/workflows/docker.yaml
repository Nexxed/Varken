name: varken
on:
  push:
    branches:
      - develop
      - cleanuparr
    tags:
      - 'v*.*.*'
    paths:
      - '.github/workflows/docker.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'data/**'
      - 'testdata/**'
      - 'tools/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal tools)" || { gofmt -l cmd internal tools; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test (race detector, coverage floor 90% per internal package)
        run: scripts/coverage.sh
      - name: Fuzz
        run: FUZZTIME=10s scripts/fuzz.sh
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  golden:
    # Regenerates the expectations from the Python version and fails if they differ from the committed ones.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Regenerate golden files from python-1.x
        run: scripts/golden.sh

  build:
    runs-on: ubuntu-latest
    needs: [test, golden]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare
        id: prep
        run: |
          # GHCR image names must be lowercase (the owner is "Nexxed").
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/varken" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.prep.outputs.version }}
            BRANCH=${{ steps.prep.outputs.branch }}
            BUILD_DATE=${{ steps.prep.outputs.build_date }}
            VCS_REF=${{ steps.prep.outputs.vcs_ref }}
